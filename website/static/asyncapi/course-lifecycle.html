<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AsyncAPI</title>

    <link rel="stylesheet" href="https://unpkg.com/@asyncapi/react-component@latest/styles/default.min.css" />

    <style>
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* перебиваем шрифты AsyncAPI */
      .asyncapi,
      .asyncapi * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif !important;
      }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@asyncapi/web-component@latest/lib/asyncapi-web-component.js" defer></script>
  </head>

  <body>
    <asyncapi-component
      id="asyncapi"
      cssImportPath="https://unpkg.com/@asyncapi/react-component@latest/styles/default.min.css">
    </asyncapi-component>

    <script>
      window.addEventListener('DOMContentLoaded', function () {
        document.getElementById('asyncapi').schema = {
          url: './course-lifecycle.yaml'
        };
      });
    </script>
  </body>
</html>
