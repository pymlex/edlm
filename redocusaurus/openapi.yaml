openapi: 3.1.0
info:
  title: EDLM API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /courses/search:
    post:
      summary: Search courses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseSearchRequest'
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSearchResponse'
  /courses/{courseId}:
    get:
      summary: Get course details
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
  /courses/{courseId}/reviews:
    get:
      summary: Get reviews
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
    post:
      summary: Create review
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
  /enrollments:
    post:
      summary: Enroll in course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Created
  /courses/{courseId}/drafts:
    post:
      summary: Create draft
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created
  /courses/{courseId}/drafts/{draftId}:
    get:
      summary: Get draft
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draft
    patch:
      summary: Update draft
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequest'
      responses:
        '204':
          description: Updated
  /courses/{courseId}/drafts/{draftId}/materials:
    post:
      summary: Upload material
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created
  /courses/{courseId}/drafts/{draftId}/generate:
    post:
      summary: Generate content
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDraftRequest'
      responses:
        '200':
          description: Generated
  /courses/{courseId}/drafts/{draftId}/publish:
    post:
      summary: Publish draft
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
components:
  schemas:
    CourseSearchRequest:
      type: object
      properties:
        query:
          type: string
        page:
          type: integer
        pageSize:
          type: integer
    CourseSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseCard'
    CourseCard:
      type: object
      properties:
        id:
          type: string
    CourseDetail:
      type: object
      properties:
        id:
          type: string
    ReviewListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
    Review:
      type: object
      properties:
        id:
          type: string
    CreateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
        text:
          type: string
    CreateEnrollmentRequest:
      type: object
      properties:
        courseId:
          type: string
    UpdateDraftRequest:
      type: object
      properties:
        title:
          type: string
    GenerateDraftRequest:
      type: object
      properties:
        prompt:
          type: string
